<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Windy City Exteriors</title>
    <meta name="robots" content="noindex" />
    <script>
      /*
        GitHub Pages has no server-side rewrite, so a hard refresh on /projects
        or /estimate lands here instead of on the app. This encodes the path
        into a query string and bounces to the site root, where the snippet in
        index.html puts the address bar back the way the visitor typed it.
        One segment is kept because the site is served from /<repository>/.
      */
      (function () {
        var segmentsToKeep = 1;
        var l = window.location;
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') +
            '/?/' +
            l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash,
        );
      })();
    </script>
  </head>
  <body></body>
</html>
